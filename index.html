<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan B — When the world doesn't come with instructions</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBg: '#f6f5ee',
            brandDark: '#1b3b36',
          }
        }
      }
    }
  </script>

  <style>
    iframe[src*="wexio"], 
    #wexio-widget-container,
    .wexio-widget-iframe {
      z-index: 99999 !important;
      display: block !important;
    }
  </style>
</head>
<body class="bg-brandBg text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-brandDark text-white py-6 px-4 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center text-white font-bold text-lg">
          BP
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">Plan B</h1>
          <p class="text-xs text-emerald-200">When the world doesn't come with instructions</p>
        </div>
      </div>
      <span class="text-xs bg-emerald-800/60 text-emerald-100 px-3 py-1 rounded-full border border-emerald-600/40">
        Global Edition
      </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-4xl mx-auto w-full p-4 md:p-6 flex flex-col items-center justify-center">
    <div class="text-center my-8">
      <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">What is happening right now?</h2>
      <p class="text-slate-600 text-sm">Select an option to start a direct session with the Plan B Assistant.</p>
    </div>

    <!-- 4 Cards de Ação direta para o Bot -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full mb-8">
      
      <button onclick="triggerBot('I don\'t know where to start with my task. Can you help me break it down into tiny micro-steps?')" 
              class="text-left p-6 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-emerald-600 hover:shadow-md transition group cursor-pointer">
        <span class="text-3xl mb-3 block">🚀</span>
        <h3 class="font-bold text-slate-800 text-lg mb-1 group-hover:text-emerald-700">Don't know where to start</h3>
        <p class="text-xs text-slate-500">You have an overwhelming task and need to extract just the first tiny action.</p>
      </button>

      <button onclick="triggerBot('I don\'t know how to complete an administrative or bureaucratic process. How do I proceed?')" 
              class="text-left p-6 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-emerald-600 hover:shadow-md transition group cursor-pointer">
        <span class="text-3xl mb-3 block">🏛️</span>
        <h3 class="font-bold text-slate-800 text-lg mb-1 group-hover:text-emerald-700">Don't know how to do it</h3>
        <p class="text-xs text-slate-500">Unclear bureaucracy, administrative hurdles, or service procedures.</p>
      </button>

      <button onclick="triggerBot('I need to draft a message to request help or ask for more time without friction. Can you write a template for me?')" 
              class="text-left p-6 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-emerald-600 hover:shadow-md transition group cursor-pointer">
        <span class="text-3xl mb-3 block">💬</span>
        <h3 class="font-bold text-slate-800 text-lg mb-1 group-hover:text-emerald-700">Don't know what to say</h3>
        <p class="text-xs text-slate-500">Need to send a request, clarify a deadline, or ask for help without friction.</p>
      </button>

      <button onclick="triggerBot('I\'m feeling stuck and cognitively frozen right now. What is my instant micro-step?')" 
              class="text-left p-6 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-emerald-600 hover:shadow-md transition group cursor-pointer">
        <span class="text-3xl mb-3 block">🧠</span>
        <h3 class="font-bold text-slate-800 text-lg mb-1 group-hover:text-emerald-700">I'm feeling stuck</h3>
        <p class="text-xs text-slate-500">Get an instant micro-step and penalty-free fallback alternative.</p>
      </button>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200/60 bg-white/50">
    Plan B © 2026 — Designed for executive autonomy and cognitive relief.
  </footer>

          window.Wexio.sendMessage(promptText);
          return;
        }
